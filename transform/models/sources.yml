version: 2

sources:
  - name: collected_raw
    description: API answers exactly as received. The pension records are read from the page files instead.
    database: collected
    schema: raw
    tables:
      - name: fsc_corp_outline_page
        description: Answers of the corporate outline API, one row per page of one asked name.

  - name: collected_meta
    description: Collection state kept by the collector.
    database: collected
    schema: meta
    tables:
      - name: publication
      - name: fsc_query
