version: 2

sources:
  - name: collected_raw
    description: Source records exactly as received from the API, one row per record.
    database: collected
    schema: raw
    tables:
      - name: nps_workplace_record
      - name: fsc_corp_outline_page
        description: Answers of the corporate outline API, one row per page of one asked name.

  - name: collected_meta
    description: Collection state kept by the collector.
    database: collected
    schema: meta
    tables:
      - name: publication
      - name: fsc_query
