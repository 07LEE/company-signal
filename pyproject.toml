[project]
name = "company-signal"
version = "0.3.0"
description = "Monthly workforce indicators for Korean workplaces from National Pension Service and FSC public data"
keywords = ["korea", "public-data", "national-pension-service", "workforce", "dbt", "duckdb"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
company-signal = "company_signal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
