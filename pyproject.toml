[project]
name = "company-signal"
version = "0.1.0"
description = "Data pipeline and CLI for looking up workplace indicators from Korean public data"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
company-signal = "company_signal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
